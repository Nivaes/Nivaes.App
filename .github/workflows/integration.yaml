name: Continuous Integration

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version:  5.0.100-preview.6.20318.15

    - name: Install dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release

    #- name: Test
    #  run: dotnet test --no-restore --verbosity detailed

    - name: Artifact
      uses: actions/upload-artifact@v2
      with:
        name: name.zip
        path: ./Artifacts/**/*.nupkg

    - name: Version and Tag
      id: bump_version
      uses: mathieudutour/github-tag-action@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Prep Version String
      run: echo ::set-env name=VERSION_NUMBER::$(echo ${{ steps.bump_version.outputs.new_tag }} | sed 's/[v]//g')

    - name: Define Package Name
      run: echo ::set-env name=PACKAGE_NAME::$"Example.PackageName/bin/Release/Example.PackageName.${{ env.VERSION_NUMBER }}.nupkg"

    - name: Set Nuget Package Version
      uses: roryprimrose/set-vs-sdk-project-version@v1
      with:
        version: ${{ env.VERSION_NUMBER }}

    - name: Publish
      #uses: tanaka-takayoshi/nuget-publish-to-github-packages-action@v2.1
      #with:
      #  nupkg-path:  './artifacts/**/*.nupkg'
      #  repo-owner:  'nivaes'
      #  gh-user:  'andrechi1'
      #  token:  ${{ secrets.GITHUB_TOKEN }}
      run: dotnet nuget push './Artifacts/**/*.nupkg'
